name: Publish installer pages
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/installer-pages.yml
      - tools/patch_installer_downloads.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download current published site
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: 42801458263
          github-token: ${{ github.token }}
          path: build/released
      - name: Update only the two installer pages
        run: |
          mkdir -p build/pages
          tar -xf build/released/artifact.tar -C build/pages
          python3 tools/patch_installer_downloads.py build/pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
