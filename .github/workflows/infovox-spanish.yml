name: Infovox 230 - Spanish Male
on:
  push:
    branches:
      - tools/infovox-spanish-20261122
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download and install genuine Infovox 230 SAPI5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/joshknnd1982/infovox230-v22-sapi5/releases/download/v1.1.2/Infovox230SAPI_Setup.exe'
          $setup = Join-Path $env:RUNNER_TEMP 'Infovox230SAPI_Setup.exe'
          Invoke-WebRequest -Uri $url -OutFile $setup
          $sha = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLower()
          Write-Output "Installer SHA256: $sha"
          if ($sha -ne 'b436576fc2272e60fba8f04340e78afc07cfa7657dcde85adab916fe046820df') { throw 'Installer SHA256 mismatch' }
          $p = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/TYPE=full') -Wait -PassThru
          Write-Output "Installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Infovox installation failed: $($p.ExitCode)" }
      - name: Render Infovox 230 words (authentic Castilian Spanish Male)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path 'infovox_words' -Force | Out-Null
          $sp = New-Object -ComObject SAPI.SpVoice
          $found = $null
          $names = @()
          $all = $sp.GetVoices()
          for ($i=0; $i -lt $all.Count; $i++) {
            $v = $all.Item($i)
            $name = [string]$v.GetDescription()
            $names += $name
            if ($name -match 'Infovox230' -and $name -match 'Castilian Spanish Male') { $found = $v }
          }
          $names | Set-Content -Encoding UTF8 'voices.txt'
          if ($null -eq $found) { throw 'Infovox230 Castilian Spanish Male voice unavailable' }
          $sp.Voice = $found
          $sp.Rate = -1
          $sp.Volume = 100
          $words = @('Música','electrónica','Figura','rítmica','Arte','política','La','era','atómica')
          for ($i=0; $i -lt $words.Count; $i++) {
            $filename = 'infovox_words/word_{0:d2}.wav' -f $i
            $stream = New-Object -ComObject SAPI.SpFileStream
            $stream.Format.Type = 22
            $stream.Open((Join-Path $env:GITHUB_WORKSPACE $filename), 3, $false)
            try {
              $sp.AudioOutputStream = $stream
              [void]$sp.Speak($words[$i], 0)
              [void]$sp.WaitUntilDone(-1)
            } finally {
              $stream.Close()
            }
            $b = (Get-Item $filename).Length
            Write-Output "Infovox $i '$($words[$i])': $b bytes"
            if ($b -lt 1500) { throw "Word $i output unexpectedly short" }
          }
      - name: Apply falling pitch to each word and slow by one-third
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check numpy soundfile praat-parselmouth
          python tools/infovox_spanish_wordfalls.py
          if (!(Test-Path 'Infovox_Spanish_Male_Wordfalls_Slower.wav')) { throw 'No final WAV' }
      - name: Save output or diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infovox-spanish-male-wordfalls
          path: |
            Infovox_Spanish_Male_Wordfalls_Slower.wav
            render_report.txt
            voices.txt
          if-no-files-found: warn
          retention-days: 30
