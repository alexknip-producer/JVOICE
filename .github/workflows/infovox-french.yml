name: Infovox 230 - French Male Slow Descent
on:
  push:
    branches:
      - tools/infovox-french-male-20261122
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download and install genuine Infovox 230 SAPI5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/joshknnd1982/infovox230-v22-sapi5/releases/download/v1.1.2/Infovox230SAPI_Setup.exe'
          $setup = Join-Path $env:RUNNER_TEMP 'Infovox230SAPI_Setup.exe'
          Invoke-WebRequest -Uri $url -OutFile $setup
          $sha = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLower()
          Write-Output "Installer SHA256: $sha"
          if ($sha -ne 'b436576fc2272e60fba8f04340e78afc07cfa7657dcde85adab916fe046820df') { throw 'Installer SHA256 mismatch' }
          $p = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/TYPE=full') -Wait -PassThru
          Write-Output "Installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Infovox installation failed: $($p.ExitCode)" }
      - name: Render five phrases with genuine Infovox French Male
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path 'infovox_phrases' -Force | Out-Null
          $sp = New-Object -ComObject SAPI.SpVoice
          $found = $null
          $names = @()
          $all = $sp.GetVoices()
          for ($i = 0; $i -lt $all.Count; $i++) {
            $v = $all.Item($i)
            $name = [string]$v.GetDescription()
            $names += $name
            if ($name -match 'Infovox230' -and $name -match 'French Male') { $found = $v }
          }
          $names | Set-Content -Encoding UTF8 'voices.txt'
          if ($null -eq $found) { throw 'Infovox230 French Male voice unavailable' }
          $sp.Voice = $found
          $sp.Volume = 100
          $phrases = @(
            @{ Text = 'Inspiration'; Pitch = 55 },
            @{ Text = 'Expiration'; Pitch = 50 },
            @{ Text = 'Contraction'; Pitch = 45 },
            @{ Text = 'Décontraction'; Pitch = 40 },
            @{ Text = 'La forme'; Pitch = 35 }
          )
          $i = 0
          foreach ($phrase in $phrases) {
            $filename = Join-Path $env:GITHUB_WORKSPACE ('infovox_phrases/phrase_{0:d2}.wav' -f ($i + 1))
            $stream = New-Object -ComObject SAPI.SpFileStream
            $stream.Format.Type = 22
            $stream.Open($filename, 3, $false)
            try {
              $sp.AudioOutputStream = $stream
              $utterance = '\Pit={0}\Spd=30\{1}' -f $phrase.Pitch, $phrase.Text
              Write-Output "Infovox French Male: $utterance"
              [void]$sp.Speak($utterance, 0)
              [void]$sp.WaitUntilDone(-1)
            } finally {
              $stream.Close()
            }
            $bytes = (Get-Item $filename).Length
            Write-Output "Phrase $($i + 1) output: $bytes bytes"
            if ($bytes -lt 1000) { throw "Phrase $($i + 1) output unexpectedly short" }
            $i++
          }
      - name: Assemble phrases and verify WAV
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check numpy soundfile
          python tools/infovox_french_phrase_mix.py
          if (!(Test-Path 'Infovox_French_Male_Slow_Descending.wav')) { throw 'No final WAV' }
          $final = Get-Item 'Infovox_French_Male_Slow_Descending.wav'
          Write-Output "Final WAV: $($final.Length) bytes"
          if ($final.Length -lt 20000) { throw 'Final WAV unexpectedly short' }
      - name: Save genuine Infovox render
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infovox-french-male-slow-descending
          path: |
            Infovox_French_Male_Slow_Descending.wav
            render_report.txt
            voices.txt
            infovox_phrases/*.wav
          if-no-files-found: warn
          retention-days: 30
