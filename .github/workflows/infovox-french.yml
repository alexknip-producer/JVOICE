name: Infovox 230 - French Male Slow Descent
on:
  push:
    branches:
      - tools/infovox-french-male-20261122
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download and install genuine Infovox 230 SAPI5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/joshknnd1982/infovox230-v22-sapi5/releases/download/v1.1.2/Infovox230SAPI_Setup.exe'
          $setup = Join-Path $env:RUNNER_TEMP 'Infovox230SAPI_Setup.exe'
          Invoke-WebRequest -Uri $url -OutFile $setup
          $sha = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLower()
          Write-Output "Installer SHA256: $sha"
          if ($sha -ne 'b436576fc2272e60fba8f04340e78afc07cfa7657dcde85adab916fe046820df') { throw 'Installer SHA256 mismatch' }
          $p = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/TYPE=full') -Wait -PassThru
          Write-Output "Installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Infovox installation failed: $($p.ExitCode)" }
      - name: Synthesize low French Male with final phrase lower
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sp = New-Object -ComObject SAPI.SpVoice
          $found = $null
          $names = @()
          $all = $sp.GetVoices()
          for ($i=0; $i -lt $all.Count; $i++) {
            $v = $all.Item($i)
            $name = [string]$v.GetDescription()
            $names += $name
            if ($name -match 'Infovox230' -and $name -match 'French Male') { $found = $v }
          }
          $names | Set-Content -Encoding UTF8 'voices.txt'
          if ($null -eq $found) { throw 'Infovox230 French Male voice unavailable' }
          $sp.Voice = $found
          $sp.Rate = 0
          $sp.Volume = 100
          # Each control tag must be fully delimited, and tags separated by spaces
          # so the opening backslash of the next tag is not a doubled backslash.
          # Pitch=85 for the first FOUR phrases; only "La forme" drops to 62.
          $phrases = @(
            @{Text='Inspiration'; Pitch=85},
            @{Text='Expiration'; Pitch=85},
            @{Text='Contraction'; Pitch=85},
            @{Text='Décontraction'; Pitch=85},
            @{Text='La forme'; Pitch=62}
          )
          $speed = 58
          $parts = @()
          for ($i=0; $i -lt $phrases.Count; $i++) {
            if ($i -gt 0) { $parts += '\Pau=650\' }
            $parts += ('\Spd={0}\' -f $speed)
            $parts += ('\Pit={0}\' -f $phrases[$i].Pitch)
            $parts += $phrases[$i].Text
          }
          $utterance = $parts -join ' '
          Write-Output "Infovox original synthesis text: $utterance"
          $output = Join-Path $env:GITHUB_WORKSPACE 'Infovox_French_Male_Low_Final_Lower.wav'
          $stream = New-Object -ComObject SAPI.SpFileStream
          $stream.Format.Type = 22
          $stream.Open($output, 3, $false)
          try {
            $sp.AudioOutputStream = $stream
            [void]$sp.Speak($utterance, 0)
            [void]$sp.WaitUntilDone(-1)
          } finally {
            $stream.Close()
          }
          $bytes = (Get-Item $output).Length
          if ($bytes -lt 20000) { throw 'Synthesized WAV unexpectedly short' }
          $report = @(
            'Infovox 230 French Male: newly synthesized, no audio processing'
            'Pitch of first four phrases: 85 (Infovox Pit tag)'
            'Pitch of last phrase: 62'
            'Speed all phrases: 58 (prior 40)'
            'Between-phrase pauses: 650 ms'
            "Output: $bytes bytes"
            "Control tags: $utterance"
          )
          $report | Set-Content -Encoding UTF8 'render_report.txt'
      - name: Verify freshly synthesized WAV duration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "import wave; f='Infovox_French_Male_Low_Final_Lower.wav'; w=wave.open(f,'rb'); d=w.getnframes()/w.getframerate(); print('Infovox WAV:', w.getframerate(), 'Hz,', round(d,2), 'seconds'); assert d>6.0; w.close()"
      - name: Save genuine Infovox render
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infovox-french-male-low-last-phrase
          path: |
            Infovox_French_Male_Low_Final_Lower.wav
            render_report.txt
            voices.txt
          if-no-files-found: warn
          retention-days: 30
